name: Build CADIME Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Create project
      run: |
        mkdir src
        cd src
        
        # 创建 csproj
        echo '<Project Sdk="Microsoft.NET.Sdk">' > CADIMEPlugin.csproj
        echo '  <PropertyGroup>' >> CADIMEPlugin.csproj
        echo '    <TargetFramework>net48</TargetFramework>' >> CADIMEPlugin.csproj
        echo '    <AssemblyName>CADIMEPlugin</AssemblyName>' >> CADIMEPlugin.csproj
        echo '    <LangVersion>8.0</LangVersion>' >> CADIMEPlugin.csproj
        echo '    <UseWindowsForms>true</UseWindowsForms>' >> CADIMEPlugin.csproj
        echo '  </PropertyGroup>' >> CADIMEPlugin.csproj
        echo '  <ItemGroup>' >> CADIMEPlugin.csproj
        echo '    <Reference Include="System" />' >> CADIMEPlugin.csproj
        echo '    <Reference Include="System.Core" />' >> CADIMEPlugin.csproj
        echo '    <Reference Include="System.Windows.Forms" />' >> CADIMEPlugin.csproj
        echo '  </ItemGroup>' >> CADIMEPlugin.csproj
        echo '</Project>' >> CADIMEPlugin.csproj
        
        # 创建 C# 文件
        echo 'using System;' > CADIMEPlugin.cs
        echo 'using System.Runtime.InteropServices;' >> CADIMEPlugin.cs
        echo 'using System.Linq;' >> CADIMEPlugin.cs
        echo '' >> CADIMEPlugin.cs
        echo 'namespace CADIMEPlugin' >> CADIMEPlugin.cs
        echo '{' >> CADIMEPlugin.cs
        echo '    public class IMESwitcher' >> CADIMEPlugin.cs
        echo '    {' >> CADIMEPlugin.cs
        echo '        [DllImport("imm32.dll")] static extern IntPtr ImmGetContext(IntPtr hWnd);' >> CADIMEPlugin.cs
        echo '        [DllImport("imm32.dll")] static extern bool ImmSetConversionStatus(IntPtr himc, int fdwConversion, int fdwSentence);' >> CADIMEPlugin.cs
        echo '        [DllImport("imm32.dll")] static extern bool ImmReleaseContext(IntPtr hWnd, IntPtr himc);' >> CADIMEPlugin.cs
        echo '        [DllImport("user32.dll")] static extern IntPtr GetFocus();' >> CADIMEPlugin.cs
        echo '        const int IME_CMODE_ALPHANUMERIC = 0x0000;' >> CADIMEPlugin.cs
        echo '        const int IME_CMODE_NATIVE = 0x0001;' >> CADIMEPlugin.cs
        echo '        static string[] EN_CMDS = { "L","LINE","C","CIRCLE","COPY","CO","MOVE","M","OFFSET","O" };' >> CADIMEPlugin.cs
        echo '        static string[] CN_CMDS = { "MT","MTEXT","TEXT","DT","T" };' >> CADIMEPlugin.cs
        echo '        public static void SwitchToEnglish()' >> CADIMEPlugin.cs
        echo '        {' >> CADIMEPlugin.cs
        echo '            try { var hwnd = GetFocus(); var himc = ImmGetContext(hwnd); if (himc != IntPtr.Zero) { ImmSetConversionStatus(himc, IME_CMODE_ALPHANUMERIC, 0); ImmReleaseContext(hwnd, himc); } } catch { }' >> CADIMEPlugin.cs
        echo '        }' >> CADIMEPlugin.cs
        echo '        public static void SwitchToChinese()' >> CADIMEPlugin.cs
        echo '        {' >> CADIMEPlugin.cs
        echo '            try { var hwnd = GetFocus(); var himc = ImmGetContext(hwnd); if (himc != IntPtr.Zero) { ImmSetConversionStatus(himc, IME_CMODE_NATIVE, 0); ImmReleaseContext(hwnd, himc); } } catch { }' >> CADIMEPlugin.cs
        echo '        }' >> CADIMEPlugin.cs
        echo '    }' >> CADIMEPlugin.cs
        echo '}' >> CADIMEPlugin.cs
    
    - name: Build
      run: |
        cd src
        dotnet build CADIMEPlugin.csproj -c Release -o ../output
    
    - name: Upload DLL
      uses: actions/upload-artifact@v4
      with:
        name: CADIMEPlugin
        path: output/*.dll
